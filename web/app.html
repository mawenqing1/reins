<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reins 控制台 — 一站式 Agent 统一指挥管理平台</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" type="image/png" href="assets/favicon.png">
<!-- 纵深防御：渲染层只加载本地资源（所有网络请求都在主进程，connect-src 可关死）；
     unsafe-inline 仅为既有内联 onclick/style 放行，远程脚本/外链回连一律拒绝 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
</head>
<body>

<div class="app">
  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <div class="side-logo">
      <svg width="24" height="24" viewBox="0 0 26 26" fill="none">
        <defs><linearGradient id="lgSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E2E33"/><stop offset="1" stop-color="#121215"/></linearGradient></defs>
        <rect width="24" height="24" rx="5.4" fill="url(#lgSide)"/>
        <text x="12.0" y="12.6" text-anchor="middle" dominant-baseline="central" font-family="ui-rounded,-apple-system,'SF Pro Rounded','PingFang SC',sans-serif" font-weight="800" font-size="13.5" fill="#FFFFFF">R</text>
        <circle cx="15.2" cy="5.8" r="1.7" fill="#f2efe9"/>
        <circle cx="19.8" cy="9" r="1.7" fill="#f2efe9"/>
      </svg>
      <span class="txt">Reins</span>
    </div>
    <div class="space-menu">
      <button class="side-space" id="space-btn" onclick="toggleSpaceMenu(event)">
        <div class="sq" id="space-badge">研</div>
        <div style="flex:1;min-width:0">
          <span class="org-line" onclick="event.stopPropagation();toggleOrgMenu(event)"><b id="org-name">我的团队</b><svg class="ocaret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
          <b id="space-name">产品研发组</b><span id="space-sprint"></span>
        </div>
        <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="space-pop" id="space-pop"></div>
      <div class="org-pop" id="org-pop"></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="node-pill" onclick="switchView('settings')" title="本机节点：桌面客户端保持在线，Agent 才能继续接收并执行任务">
        <span class="ndot"></span><span class="np-txt">本机节点在线 · <span id="node-uptime">刚刚启动</span></span>
      </div>
      <div class="side-user">
        <div class="av">我</div>
        <div><b>我</b><span>空间管理员</span></div>
      </div>
      <button class="btn-reset" onclick="confirmReset()">清空数据</button>
      <button class="side-collapse" id="side-collapse" onclick="toggleSidebar()" title="折叠/展开侧栏（⌘B）"><svg class="lic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg></button>
    </div>
  </aside>

  <!-- ===== 主区域 ===== -->
  <div class="main">
    <div class="topbar">
      <div><h1 id="view-title">看板</h1><div class="sub" id="view-sub"></div></div>
      <div class="topbar-bell" id="bell-wrap">
        <button class="bell-btn" onclick="toggleNotif(event)" title="通知中心"><svg class="lic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg><span class="badge" id="bell-badge" style="display:none"></span></button>
        <div class="notif-pop" id="notif-pop"></div>
      </div>
      <div class="search"><input id="search" placeholder="搜索任务 / 关键字…"></div>
      <button class="btn btn-p" onclick="openNewTaskModal()"><svg class="lic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>新建任务</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- ===== 任务详情抽屉 ===== -->
<div class="drawer-mask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>

<!-- ===== 通用模态 ===== -->
<div class="modal-mask" id="modal-mask"><div class="modal" id="modal"></div></div>

<!-- ===== 通知 ===== -->
<div class="toasts" id="toasts"></div>

<!-- 托盘角标绘制的隐藏素材（主进程经 executeJavaScript 取图） -->
<img id="tray-base-src" src="assets/tray-32.png" style="display:none" alt="">
<canvas id="tray-badge-canvas" width="32" height="32" style="display:none"></canvas>

<script src="assets/icons.js"></script>
<script src="assets/brands.js"></script>
<script src="assets/execlog.js"></script>
<script src="assets/taskflow.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
