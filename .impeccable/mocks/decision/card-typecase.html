<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>活字工坊 — 首屏草图</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body{
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#141418; color:#f2efe9; overflow:hidden;
    display:flex; flex-direction:column; min-height:100vh;
  }
  /* 印床（压印台）的深油墨黑作全页地；套准十字线是结构家具 */
  .reg{ position:absolute; width:18px; height:18px; opacity:.35; }
  .reg::before,.reg::after{ content:""; position:absolute; background:#8a8f96; }
  .reg::before{ left:50%; top:0; width:1px; height:100%; }
  .reg::after{ top:50%; left:0; height:1px; width:100%; }
  nav{
    display:flex; align-items:center; gap:34px;
    padding:20px 56px; border-bottom:1px solid #34343b;
  }
  .logo{ font-weight:800; font-size:20px; letter-spacing:.02em; display:flex; align-items:center; gap:10px; }
  .logo .seal{
    width:26px; height:26px; background:#c73e2e; border-radius:5px;
    display:inline-flex; align-items:center; justify-content:center;
    color:#fff; font-size:14px; font-weight:800;
  }
  nav a{ color:#b9bcc2; text-decoration:none; font-size:14px; }
  nav a.hot{ color:#f2efe9; }
  nav .gh{ margin-left:auto; border:1px solid #4a4a52; padding:7px 16px; border-radius:6px; color:#f2efe9; font-size:13px; }
  main{ flex:1; display:grid; grid-template-columns: 46% 54%; }
  .copy{ padding:72px 24px 0 56px; position:relative; }
  h1{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-weight:900; font-size:64px; line-height:1.18; letter-spacing:.01em;
  }
  h1 em{ font-style:normal; color:#d84a35; }
  .sub{ margin-top:26px; font-size:17px; line-height:1.8; color:#a9adb4; max-width:34em; }
  .sub b{ color:#e6e3dc; }
  .ctas{ margin-top:40px; display:flex; gap:16px; align-items:center; }
  .btn-seal{
    background:#c73e2e; color:#fff; text-decoration:none; font-weight:700; font-size:16px;
    padding:15px 30px; border-radius:7px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.22), inset 0 0 0 5px #c73e2e, 0 3px 0 #7e2418;
    /* 印章按钮：内圈白线是印文边栏，底边实体投影来自铅台的厚度 */
  }
  .btn-line{ color:#d7d9dd; text-decoration:none; font-size:15px; border-bottom:1px solid #55555e; padding-bottom:3px; }
  .note{ margin-top:34px; font-size:13px; color:#84878e; }
  .note b{ color:#d84a35; }
  /* 右半：字盘 + 铺在旁边的印张 */
  .case-wrap{ position:relative; padding:56px 56px 0 20px; }
  .typecase{
    display:grid; grid-template-columns:repeat(14,1fr); gap:5px;
    background:#232227; border:1px solid #3c3b41; border-radius:10px;
    padding:14px; box-shadow:0 14px 40px rgba(0,0,0,.5);
  }
  .cell{ aspect-ratio:1; background:#1b1a1f; border-radius:4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), inset 0 -2px 3px rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    font-family:"Songti SC",serif; font-weight:900; font-size:20px; color:#d8d2c4;
  }
  .cell.picked{ background:#c73e2e; color:#fff; box-shadow:0 0 0 3px rgba(199,62,46,.28); }
  .cell.empty::after{ content:""; width:8px; height:8px; border-radius:50%; background:#2e2d33; }
  .proof{
    position:absolute; right:64px; bottom:-34px; width:62%;
    background:#f5f1e8; color:#1d1d20; border-radius:6px;
    padding:22px 26px 18px; box-shadow:0 18px 44px rgba(0,0,0,.55);
  }
  .proof .head{ font-size:11px; letter-spacing:.18em; color:#8b857a; display:flex; justify-content:space-between; margin-bottom:12px; }
  .proof .head .run{ color:#c73e2e; }
  .proof .line{ font-family:"Songti SC",serif; font-weight:700; font-size:17px; line-height:2; }
  .proof .cursor{
    display:inline-block; width:19px; height:19px; background:#c73e2e; vertical-align:-3px;
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.25} }
  .proof .meter{ height:3px; background:#e4dfd4; margin-top:14px; border-radius:2px; overflow:hidden; }
  .proof .meter i{ display:block; height:100%; width:62%; background:#c73e2e; }
</style>
</head>
<body>
  <span class="reg" style="top:14px;right:60px"></span>
  <span class="reg" style="bottom:16px;left:16px"></span>
  <nav>
    <span class="logo"><span class="seal">R</span>Reins</span>
    <a href="#">场景</a><a href="#">产品能力</a><a href="#">工作方式</a><a href="#">集成</a><a href="#">FAQ</a>
    <a class="gh" href="#">GitHub ↗</a>
  </nav>
  <main>
    <div class="copy">
      <h1>你的<em>活字</em>已上盘，<br>只等一句派活。</h1>
      <p class="sub">写代码、做调研、整资料、处理工单——把活儿说清楚，拣字、排版、上机印刷，<b>一条流水线交到你手上</b>；每一版拓样都可回放，验收的印章握在你手里。</p>
      <div class="ctas">
        <a class="btn-seal" href="#">GitHub 获取源码</a>
        <a class="btn-line" href="#">怎么派活？三步搞定 →</a>
      </div>
      <p class="note">token 走你自己的订阅，平台<b>不抽成</b>；接入 Claude、Codex、GLM，不用重新付费。</p>
    </div>
    <div class="case-wrap">
      <div class="typecase">
        <div class="cell">派</div><div class="cell empty"></div><div class="cell">码</div><div class="cell empty"></div>
        <div class="cell empty"></div><div class="cell">查</div><div class="cell empty"></div><div class="cell">审</div>
        <div class="cell empty"></div><div class="cell empty"></div><div class="cell picked">验</div><div class="cell empty"></div>
        <div class="cell">并</div><div class="cell empty"></div>
        <div class="cell empty"></div><div class="cell">工</div><div class="cell empty"></div><div class="cell empty"></div>
        <div class="cell">单</div><div class="cell empty"></div><div class="cell">测</div><div class="cell empty"></div>
        <div class="cell empty"></div><div class="cell">报</div><div class="cell empty"></div><div class="cell empty"></div>
        <div class="cell empty"></div><div class="cell">稿</div>
      </div>
      <div class="proof">
        <div class="head"><span>印张 · REINS-96 竞品调研</span><span class="run">● 拣字中</span></div>
        <div class="line">已读完 214 页材料，结论排作十二行，来源注于边栏。<span class="cursor"></span></div>
        <div class="meter"><i></i></div>
      </div>
    </div>
  </main>
</body>
</html>
