name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 源码已全部 TypeScript 化：tsc 编译即类型/语法门，node --check 不再需要。
      # ELECTRON_SKIP_BINARY_DOWNLOAD：CI 不跑 GUI，跳过 Electron 二进制下载提速。
      - name: Install & build
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build (tsc)
        run: npm run build
      - name: Run tests
        run: node dist/test/run.js
